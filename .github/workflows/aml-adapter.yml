name: AML adapter

on:
  pull_request:
    paths:
      - 'hindsight-api-slim/hindsight_api/extensions/builtin/aml.py'
      - 'hindsight-api-slim/hindsight_api/engine/memory_engine.py'
      - 'hindsight-api-slim/hindsight_api/engine/operation_metadata.py'
      - 'hindsight-api-slim/tests/test_aml_http_extension.py'
      - 'hindsight-system-tests/tests/test_75_aml_adapter.py'
      - 'hindsight-extensions/aml/**'
      - '.github/workflows/aml-adapter.yml'
      - '.github/workflows/test.yml'
  push:
    branches: [main, 'feat/aml-*']
    paths:
      - 'hindsight-api-slim/**'
      - 'hindsight-system-tests/**'
      - 'hindsight-extensions/aml/**'
      - '.github/workflows/aml-adapter.yml'
      - '.github/workflows/test.yml'

permissions:
  contents: read

concurrency:
  group: aml-adapter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-system:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install the slim server and deterministic test dependencies
        run: |
          uv sync --frozen --package hindsight-api-slim --package hindsight-client --extra test --extra embedded-db
          uv pip install --python .venv/bin/python --no-deps -e hindsight-system-tests
      - name: Validate AML contract and native task replay
        run: .venv/bin/pytest -o addopts='' hindsight-api-slim/tests/test_aml_http_extension.py -q
      - name: Verify API, worker, PostgreSQL and restart through public APIs
        run: .venv/bin/pytest -o addopts='' hindsight-system-tests/tests/test_75_aml_adapter.py -q
      - name: Preserve logs when the system story fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aml-system-logs
          path: /tmp/pytest-of-runner/**/test_aml*/**/*.log
          if-no-files-found: ignore
